name: CI/CD Pipeline

# =============================================================================
# GITHUB SECRETS AND VARIABLES CONFIGURATION
# =============================================================================
# Required GitHub Secrets (Repository Settings > Secrets and variables > Actions):
# - HEROKU_API_KEY: Heroku API token for deployment
# - HEROKU_EMAIL: Email associated with Heroku account
# - ACCESS_TOKEN_KEY: JWT access token key for production
# - REFRESH_TOKEN_KEY: JWT refresh token key for production
# - CODECOV_TOKEN: Codecov token for coverage reports (optional)
#
# Required GitHub Variables (Repository Settings > Secrets and variables > Actions):
# - HEROKU_APP_NAME: Heroku app name (e.g., 'my-forum-api')
# =============================================================================

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'

jobs:
  # Job untuk testing dan linting
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forumapi_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create test environment file
      run: |
        cat > .env << EOF
        # Test Environment Configuration
        NODE_ENV=test
        HOST=localhost
        PORT=5000
        
        # Test Database Configuration
        PGHOST=localhost
        PGPORT=5432
        PGDATABASE=forumapi_test
        PGUSER=postgres
        PGPASSWORD=postgres
        
        # JWT Configuration for testing
        ACCESS_TOKEN_KEY=super_secret_access_token_key_for_testing_minimum_32_chars
        REFRESH_TOKEN_KEY=super_secret_refresh_token_key_for_testing_minimum_32_chars
        ACCESS_TOKEN_AGE=900
        REFRESH_TOKEN_AGE=604800
        
        # Logging Configuration
        LOG_LEVEL=error
        DETAILED_ERRORS=false
        ENABLE_DOCS=false
        
        # Security Configuration
        RATE_LIMIT_MAX=1000
        EOF

    - name: Create test database config
      run: |
        mkdir -p config/database
        cat > config/database/test.json << EOF
        {
          "user": "postgres",
          "password": "postgres",
          "host": "localhost",
          "port": 5432,
          "database": "forumapi_test"
        }
        EOF

    - name: Run database migrations
      run: |
        export PGHOST=localhost
        export PGPORT=5432
        export PGUSER=postgres
        export PGPASSWORD=postgres
        export PGDATABASE=forumapi_test
        npm run migrate:test up
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: postgres
        PGDATABASE: forumapi_test

    - name: Run linting
      run: npm run lint

    - name: Run tests with coverage
      run: npm run test:ci
      env:
        NODE_ENV: test
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: postgres
        PGDATABASE: forumapi_test
        ACCESS_TOKEN_KEY: super_secret_access_token_key_for_testing_minimum_32_chars
        REFRESH_TOKEN_KEY: super_secret_refresh_token_key_for_testing_minimum_32_chars
        ACCESS_TOKEN_AGE: 900
        REFRESH_TOKEN_AGE: 604800

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Job untuk security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: |
        npm audit --audit-level=moderate || echo "Security vulnerabilities found but continuing..."
        npm audit fix --dry-run || echo "Audit fix dry run completed"
      continue-on-error: true
    
    - name: Check for high severity vulnerabilities
      run: |
        if npm audit --audit-level=high --json | jq -e '.vulnerabilities | length > 0' > /dev/null 2>&1; then
          echo "⚠️ High severity vulnerabilities found!"
          npm audit --audit-level=high
        else
          echo "✅ No high severity vulnerabilities found"
        fi
      continue-on-error: true

  # Job untuk deployment ke Heroku (hanya untuk branch main)
  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Deploy to Heroku
      uses: akhileshns/heroku-deploy@v3.12.14
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ vars.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        healthcheck: "https://${{ vars.HEROKU_APP_NAME }}.herokuapp.com/health"
        checkstring: "ok"
        delay: 5
        rollbackonhealthcheckfailed: true

    - name: Post-deployment notification
      if: success()
      run: |
        echo "🚀 Deployment successful!"
        echo "Application URL: https://${{ vars.HEROKU_APP_NAME }}.herokuapp.com"

    - name: Deployment failure notification
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Please check the logs and try again."

  # Job untuk notifikasi status deployment
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && github.ref == 'refs/heads/main'

    steps:
    - name: Deployment Success Notification
      if: needs.deploy.result == 'success'
      run: |
        echo "✅ Forum API successfully deployed to production!"
        echo "🌐 Live URL: https://${{ vars.HEROKU_APP_NAME }}.herokuapp.com"
        echo "📊 Pipeline completed successfully"

    - name: Deployment Failure Notification
      if: needs.deploy.result == 'failure'
      run: |
        echo "❌ Forum API deployment failed!"
        echo "🔍 Please check the deployment logs"
        echo "🛠️ Manual intervention may be required"