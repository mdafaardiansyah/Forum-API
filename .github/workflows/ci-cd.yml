name: CI/CD Pipeline

# =============================================================================
# GITHUB SECRETS AND VARIABLES CONFIGURATION
# =============================================================================
# Required GitHub Secrets (Repository Settings > Secrets and variables > Actions):
# - POSTGRES_TEST_PASSWORD: PostgreSQL password for testing (fallback: 'postgres')
# - ACCESS_TOKEN_KEY_TEST: JWT access token key for testing
# - REFRESH_TOKEN_KEY_TEST: JWT refresh token key for testing
# - REDIS_PASSWORD_TEST: Redis password for testing (optional)
# - HEROKU_API_KEY: Heroku API token for CI deploy (from Account Settings)
# - ACCESS_TOKEN_KEY_PROD: JWT access token key for production
# - REFRESH_TOKEN_KEY_PROD: JWT refresh token key for production
#
# Required GitHub Variables (Repository Settings > Secrets and variables > Actions):
# - POSTGRES_TEST_DB: Test database name (fallback: 'forumapi_test')
# - PGHOST_TEST: Database host for testing (fallback: 'localhost')
# - PGUSER_TEST: Database user for testing (fallback: 'postgres')
# - PGPORT_TEST: Database port for testing (fallback: '5432')
# - ACCESS_TOKEN_AGE: JWT token expiration time (fallback: '3000')
# - REDIS_HOST_TEST: Redis host for testing (fallback: 'localhost')
# - REDIS_PORT_TEST: Redis port for testing (fallback: '6379')
# - HEROKU_APP_NAME: Heroku app name (e.g., 'my-forum-api')
# - FORUM_API_BASE_URL_HTTPS: Public HTTPS base URL via Cloudflare (e.g., 'https://api.example.com')
# =============================================================================

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD || 'postgres' }}
          POSTGRES_DB: ${{ vars.POSTGRES_TEST_DB || 'forumapi_test' }}
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h ${{ vars.PGHOST_TEST || 'localhost' }} -p ${{ vars.PGPORT_TEST || '5432' }} -U ${{ vars.PGUSER_TEST || 'postgres' }}; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
    
    - name: Setup test database
      run: |
        PGPASSWORD=${{ secrets.POSTGRES_TEST_PASSWORD || 'postgres' }} psql -h localhost -U postgres -c "CREATE DATABASE ${{ vars.POSTGRES_TEST_DB || 'forumapi_test' }};"
      env:
        PGPASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD || 'postgres' }}
    
    - name: Run database migrations
      run: npm run migrate:test up
      env:
        PGHOST: ${{ vars.PGHOST_TEST || 'localhost' }}
        PGUSER: ${{ vars.PGUSER_TEST || 'postgres' }}
        PGDATABASE: ${{ vars.POSTGRES_TEST_DB || 'forumapi_test' }}
        PGPASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD || 'postgres' }}
        PGPORT: ${{ vars.PGPORT_TEST || '5432' }}
    
    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test
        PGHOST: ${{ vars.PGHOST_TEST || 'localhost' }}
        PGUSER: ${{ vars.PGUSER_TEST || 'postgres' }}
        PGDATABASE: ${{ vars.POSTGRES_TEST_DB || 'forumapi_test' }}
        PGPASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD || 'postgres' }}
        PGPORT: ${{ vars.PGPORT_TEST || '5432' }}
        ACCESS_TOKEN_KEY: ${{ secrets.ACCESS_TOKEN_KEY_TEST }}
        REFRESH_TOKEN_KEY: ${{ secrets.REFRESH_TOKEN_KEY_TEST }}
        ACCESS_TOKEN_AGE: ${{ vars.ACCESS_TOKEN_AGE || '3000' }}
        REDIS_HOST: ${{ vars.REDIS_HOST_TEST || 'localhost' }}
        REDIS_PORT: ${{ vars.REDIS_PORT_TEST || '6379' }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD_TEST || '' }}
    
    - name: Run linting
      run: npm run lint
      continue-on-error: true
    
    - name: Generate test coverage
      run: npm run test:coverage
      env:
        NODE_ENV: test
        PGHOST: ${{ vars.PGHOST_TEST || 'localhost' }}
        PGUSER: ${{ vars.PGUSER_TEST || 'postgres' }}
        PGDATABASE: ${{ vars.POSTGRES_TEST_DB || 'forumapi_test' }}
        PGPASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD || 'postgres' }}
        PGPORT: ${{ vars.PGPORT_TEST || '5432' }}
        ACCESS_TOKEN_KEY: ${{ secrets.ACCESS_TOKEN_KEY_TEST }}
        REFRESH_TOKEN_KEY: ${{ secrets.REFRESH_TOKEN_KEY_TEST }}
        ACCESS_TOKEN_AGE: ${{ vars.ACCESS_TOKEN_AGE || '3000' }}
        REDIS_HOST: ${{ vars.REDIS_HOST_TEST || 'localhost' }}
        REDIS_PORT: ${{ vars.REDIS_PORT_TEST || '6379' }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD_TEST || '' }}
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: true
    
    - name: Run dependency check
      run: npx audit-ci --config .auditrc.json
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --only=production
    
    - name: Create deployment artifact
      run: |
        tar -czf forum-api-${{ github.sha }}.tar.gz \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=tests \
          --exclude=coverage \
          --exclude=.github \
          .
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: forum-api-build
        path: forum-api-${{ github.sha }}.tar.gz
        retention-days: 30

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: forum-api-build
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: scp, rsync, or deployment service API calls
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: forum-api-build
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Heroku CLI
      run: |
        curl https://cli-assets.heroku.com/install.sh | sh
    
    - name: Git remote add Heroku
      run: |
        heroku git:remote -a ${{ vars.HEROKU_APP_NAME }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    
    - name: Authenticate Heroku
      run: |
        heroku auth:token
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

    - name: Set Heroku config vars
      run: |
        heroku config:set \
          NODE_ENV=production \
          ACCESS_TOKEN_KEY="${{ secrets.ACCESS_TOKEN_KEY_PROD }}" \
          REFRESH_TOKEN_KEY="${{ secrets.REFRESH_TOKEN_KEY_PROD }}" \
          ACCESS_TOKEN_AGE="${{ vars.ACCESS_TOKEN_AGE || '3000' }}" \
          --app ${{ vars.HEROKU_APP_NAME }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    
    - name: Push to Heroku
      run: |
        git push https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ vars.HEROKU_APP_NAME }}.git HEAD:main
    
    - name: Run migrations on Heroku
      run: |
        heroku run npm run migrate up --app ${{ vars.HEROKU_APP_NAME }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    
    - name: Run Postman tests against HTTPS
      run: |
        npm install -g newman newman-reporter-htmlextra
        newman run "docs/api/postman/v1/Forum API V1 Test.postman_collection.json" \
          -e "docs/api/postman/v1/Forum API V1 Test.postman_environment.json" \
          --env-var baseUrl=${{ vars.FORUM_API_BASE_URL_HTTPS }} \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export newman-report.html
    
    - name: Upload Newman HTML report
      uses: actions/upload-artifact@v3
      with:
        name: postman-newman-report
        path: newman-report.html
    
    - name: Run health check
      run: |
        curl -f ${{ vars.FORUM_API_BASE_URL_HTTPS }}/health || exit 1
    
    - name: Notify deployment success
      run: |
        echo "Production deployment completed successfully!"
        # Add notification commands here (Slack, email, etc.)